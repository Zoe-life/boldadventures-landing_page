services:
  - type: web
    name: boldadventures-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Option 1: Use Doppler for secrets management (Recommended)
      # Add only DOPPLER_TOKEN to Render environment variables
      # All other secrets will be fetched from Doppler automatically
      # - key: DOPPLER_TOKEN
      #   sync: false
      
      # Option 2: Traditional environment variables (fallback)
      # Uncomment and configure these if not using Doppler
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_ROUNDS
        value: 12
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      - key: CLIENT_URL
        sync: false
    healthCheckPath: /api/health
